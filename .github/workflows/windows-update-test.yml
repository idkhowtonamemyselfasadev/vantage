name: windows-update-test
on:
  workflow_dispatch:
  push:
    branches: [ci-windows-update-test]
permissions:
  contents: read
jobs:
  windows-update:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Level A - locked jar, helper swap on NTFS
        shell: pwsh
        run: python winci/level_a.py
      - name: Level B - real Minecraft 1.21.11 + Fabric launch, real auto update
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python winci/level_b.py
      - name: Collect logs
        if: always()
        shell: pwsh
        run: |
          if (Test-Path work) { Get-ChildItem work -Recurse -Include *.log,*.txt,*.gz,*.json,*.sha256,*.prev,*.new,update-pending -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\meta\\' } | Select-Object FullName,Length | Format-Table -AutoSize | Out-String -Width 250 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-logs
          path: |
            work/logs/**
            work/game/logs/**
            work/game/config/vantage/**
            work/game/mods/**
            work/game/crash-reports/**
            work/levela/**
          if-no-files-found: warn
